# PIKORUA website — Nginx site file for the shared VPS.
# Install as a NEW file only; never edit other sites or nginx.conf:
#   sudo cp deploy/nginx/pikorua.in.conf /etc/nginx/sites-available/pikorua-website.conf
#   sudo ln -s /etc/nginx/sites-available/pikorua-website.conf /etc/nginx/sites-enabled/pikorua-website.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Staging first (server_name below), then:
#   sudo certbot --nginx --cert-name pikorua-website -d staging.pikorua.in
# At cutover change server_name to "pikorua.in www.pikorua.in" and re-run
# certbot with --cert-name pikorua-website -d pikorua.in -d www.pikorua.in.
# NEVER use cert name "pikorua" — it belongs to the blast sites.

upstream pikorua_app {
    # pikorua-website-app container (docker-compose.yml)
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.pikorua.in;

    # Admin uploads go through Server Actions (bodySizeLimit 15mb in next.config.ts).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Uploaded media (MEDIA_DIR), served directly from disk.
    location /media/ {
        alias /var/www/pikorua-media/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The in-house CRM calls the app directly on 127.0.0.1:APP_PORT.
    # Never expose the lead feed to the internet.
    location /api/crm/ {
        return 404;
    }

    location / {
        proxy_pass http://pikorua_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
