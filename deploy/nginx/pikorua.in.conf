# PIKORUA website — Nginx site file for the shared VPS.
# Install as a NEW file only; never edit other sites or nginx.conf:
#   sudo cp deploy/nginx/pikorua.in.conf /etc/nginx/sites-available/pikorua.in
#   (replace APP_PORT below with the free port chosen in Phase 1a)
#   sudo ln -s /etc/nginx/sites-available/pikorua.in /etc/nginx/sites-enabled/pikorua.in
#   sudo nginx -t && sudo systemctl reload nginx
# Then run Certbot for pikorua.in + www.pikorua.in, which adds the 443 blocks.

upstream pikorua_app {
    server 127.0.0.1:APP_PORT;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pikorua.in www.pikorua.in;

    # Admin uploads go through Server Actions (bodySizeLimit 15mb in next.config.ts).
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Uploaded media (MEDIA_DIR), served directly from disk.
    location /media/ {
        alias /var/www/pikorua-media/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The in-house CRM calls the app directly on 127.0.0.1:APP_PORT.
    # Never expose the lead feed to the internet.
    location /api/crm/ {
        return 404;
    }

    location / {
        proxy_pass http://pikorua_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
